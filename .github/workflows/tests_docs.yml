name: Docs tests
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    paths:
      - '.github/workflows/tests_docs.yml'
      - 'mrmustard/**'
      - 'pyproject.toml'

jobs:
  docs:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      HYPOTHESIS_PROFILE: ci

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.11"
          python-version: "3.13"

      - name: Run doctests
        run: |
          uv run --no-editable --all-extras --group doc pytest --doctest-modules mrmustard/physics/ansatz
          uv run --no-editable --all-extras --group doc pytest --doctest-modules mrmustard/lab

      - name: Build docs
        run: uv run --no-editable --all-extras --group doc sphinx-build -W --keep-going doc doc/_build/html
